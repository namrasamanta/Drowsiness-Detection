<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .flow {
      stroke-dasharray: 6 5;
      animation: dash 1.1s linear infinite;
    }
    @keyframes dash {
      to { stroke-dashoffset: -11; }
    }
    .pulse {
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      50% { opacity: 0.45; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="620" fill="#ffffff"/>
  <text x="490" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Drowsiness Detection — Architecture</text>

  <!-- ===== Column 1: capture pipeline ===== -->
  <rect x="25" y="60" width="175" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="112" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Camera</text>
  <text x="112" y="99" text-anchor="middle" font-size="11" fill="#475569">webcam or phone IP stream</text>

  <line x1="112" y1="112" x2="112" y2="140" stroke="#64748b" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>

  <rect x="25" y="142" width="175" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="112" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Frame prep</text>
  <text x="112" y="181" text-anchor="middle" font-size="11" fill="#475569">resize + grayscale</text>

  <line x1="112" y1="194" x2="112" y2="222" stroke="#64748b" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>

  <rect x="25" y="224" width="175" height="66" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="112" y="246" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Face detection</text>
  <text x="112" y="263" text-anchor="middle" font-size="11" fill="#475569">dlib HOG @ 320 px,</text>
  <text x="112" y="278" text-anchor="middle" font-size="11" fill="#475569">every 5th frame when locked</text>

  <line x1="112" y1="290" x2="112" y2="318" stroke="#64748b" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
  <text x="126" y="310" font-size="10" fill="#475569">face found</text>

  <rect x="25" y="320" width="175" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="112" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">68 landmarks</text>
  <text x="112" y="359" text-anchor="middle" font-size="11" fill="#475569">dlib shape predictor, every frame</text>

  <!-- no face path down to face-lost ladder -->
  <path d="M 200 257 C 300 257 300 480 448 480" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" class="flow" marker-end="url(#arrow)"/>
  <text x="292" y="443" font-size="10" fill="#475569">no face</text>

  <!-- ===== Column 2: metrics ===== -->
  <rect x="255" y="90" width="160" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="335" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">EAR</text>
  <text x="335" y="129" text-anchor="middle" font-size="11" fill="#1e40af">eye aspect ratio</text>

  <rect x="255" y="180" width="160" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="335" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">MAR</text>
  <text x="335" y="219" text-anchor="middle" font-size="11" fill="#1e40af">mouth aspect ratio</text>

  <rect x="255" y="270" width="160" height="86" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="335" y="292" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Head pose</text>
  <text x="335" y="309" text-anchor="middle" font-size="11" fill="#1e40af">solvePnP &#8594; pitch, yaw</text>
  <text x="335" y="324" text-anchor="middle" font-size="11" fill="#1e40af">|yaw| &gt; 25&#176; pauses eye/mouth;</text>
  <text x="335" y="339" text-anchor="middle" font-size="11" fill="#1e40af">held 3 s / 6 s &#8594; distraction alerts</text>

  <line x1="200" y1="332" x2="253" y2="119" stroke="#64748b" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
  <line x1="200" y1="340" x2="253" y2="209" stroke="#64748b" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
  <line x1="200" y1="348" x2="253" y2="305" stroke="#64748b" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>

  <!-- ===== Column 3: signals ===== -->
  <rect x="450" y="60" width="220" height="58" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="560" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Microsleep</text>
  <text x="560" y="99" text-anchor="middle" font-size="11" fill="#991b1b">EAR &lt; threshold for 3 s</text>

  <rect x="450" y="150" width="220" height="58" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="560" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#713f12">PERCLOS</text>
  <text x="560" y="189" text-anchor="middle" font-size="11" fill="#854d0e">&gt; 30% eye closure in rolling 30 s</text>

  <rect x="450" y="240" width="220" height="58" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="560" y="262" text-anchor="middle" font-size="13" font-weight="600" fill="#713f12">Yawning</text>
  <text x="560" y="279" text-anchor="middle" font-size="11" fill="#854d0e">MAR &gt; 0.45 held 1 s, &#8805; 2 per minute</text>

  <rect x="450" y="330" width="220" height="58" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="560" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Head nod</text>
  <text x="560" y="369" text-anchor="middle" font-size="11" fill="#991b1b">pitch &#8722; baseline &gt; 20&#176; for 1.5 s</text>

  <rect x="450" y="415" width="220" height="95" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="560" y="434" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Face-lost ladder</text>
  <text x="560" y="450" text-anchor="middle" font-size="11" fill="#991b1b">2 s &#8594; warning &#183; 4 s &#8594; alarm</text>
  <text x="560" y="464" text-anchor="middle" font-size="11" fill="#991b1b">seat occupancy: snapshot correlation,</text>
  <text x="560" y="478" text-anchor="middle" font-size="11" fill="#991b1b">motion, body detector &#8594; keep alarming;</text>
  <text x="560" y="492" text-anchor="middle" font-size="11" fill="#991b1b">empty 20 s &#8594; silence + recalibrate</text>

  <line x1="415" y1="119" x2="448" y2="95" stroke="#64748b" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
  <line x1="415" y1="130" x2="448" y2="175" stroke="#64748b" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
  <line x1="415" y1="209" x2="448" y2="265" stroke="#64748b" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
  <line x1="415" y1="310" x2="448" y2="355" stroke="#64748b" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>

  <!-- ===== Column 4: outputs ===== -->
  <rect x="750" y="130" width="200" height="70" rx="8" fill="#dc2626" stroke="#991b1b" stroke-width="1.5" class="pulse"/>
  <text x="850" y="157" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">RED ALERT</text>
  <text x="850" y="176" text-anchor="middle" font-size="11" fill="#fecaca">repeating audio alarm + banner</text>

  <rect x="750" y="240" width="200" height="70" rx="8" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="850" y="267" text-anchor="middle" font-size="13" font-weight="700" fill="#422006">YELLOW WARNING</text>
  <text x="850" y="286" text-anchor="middle" font-size="11" fill="#713f12">on-screen only, no alarm</text>

  <rect x="750" y="350" width="200" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="850" y="374" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">HUD + console log</text>
  <text x="850" y="392" text-anchor="middle" font-size="11" fill="#475569">FPS, EAR, MAR, PERCLOS, pitch, yaw</text>

  <rect x="750" y="430" width="200" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="850" y="454" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Phone live view</text>
  <text x="850" y="472" text-anchor="middle" font-size="11" fill="#475569">--serve: MJPEG over Wi-Fi</text>

  <line x1="670" y1="89" x2="748" y2="150" stroke="#dc2626" stroke-width="1.5" class="flow" marker-end="url(#arrowRed)"/>
  <line x1="670" y1="359" x2="748" y2="185" stroke="#dc2626" stroke-width="1.5" class="flow" marker-end="url(#arrowRed)"/>
  <line x1="670" y1="450" x2="748" y2="195" stroke="#dc2626" stroke-width="1.5" class="flow" marker-end="url(#arrowRed)"/>
  <line x1="670" y1="179" x2="748" y2="265" stroke="#ca8a04" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
  <line x1="670" y1="269" x2="748" y2="280" stroke="#ca8a04" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>

  <!-- ===== Calibration ===== -->
  <rect x="25" y="520" width="645" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="347" y="545" text-anchor="middle" font-size="13" font-weight="600" fill="#064e3b">Startup calibration (~5 s)</text>
  <text x="347" y="564" text-anchor="middle" font-size="11" fill="#065f46">facing-forward frames only &#8594; baseline head pitch (clamped &#177;25&#176;) + personal eye-closed threshold</text>
  <text x="347" y="579" text-anchor="middle" font-size="11" fill="#065f46">re-runs automatically when a driver returns after absence</text>

  <line x1="560" y1="518" x2="560" y2="510" stroke="#059669" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
  <path d="M 490 518 C 490 400 470 395 470 390" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4" class="flow" marker-end="url(#arrow)"/>
  <path d="M 300 518 C 300 460 335 430 335 342" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4" class="flow" marker-end="url(#arrow)"/>
  <text x="240" y="470" font-size="10" fill="#065f46">thresholds</text>
</svg>
